spring.application.name=mistrallangchain2

mistral.api.key=${MISTRAL_API_KEY:}
mistral.api.url=https://api.mistral.ai/v1/chat/completions

#MISTRAL_AI_API_KEY=${MISTRAL_API_KEY:}
spring.ai.mistral.api-key=${MISTRAL_API_KEY:}
spring.ai.mistral.base-url=https://api.mistral.ai
spring.ai.mistralai.chat.base-url=https://api.mistral.ai/v1
spring.ai.mistralai.chat.model=mistral-tiny # or mistral-small, mistral-medium, etc.

langchain4j.mistral-ai.chat-model.base-url=https://api.mistral.ai/v1


#spring.ai.mistral.chat.base-url=https://api.mistral.ai/v1
#spring.ai.mistral.chat.base-url=https://api.mistral.ai/v1/chat/completions

spring.autoconfigure.exclude=\
  org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration,\
  org.springframework.ai.model.mistralai.autoconfigure.MistralAiChatAutoConfiguration,\
  org.springframework.ai.model.mistralai.autoconfigure.MistralAiEmbeddingAutoConfiguration,\
  org.springframework.ai.model.mistralai.autoconfigure.MistralAiModerationAutoConfiguration,\
  org.springframework.ai.model.mistralai.autoconfigure.MistralAiOcrAutoConfiguration


